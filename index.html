<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Imposters Among Us</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #090b12;
      color: white;
      line-height: 1.6;
    }

    header {
      background: #111522;
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid #292e40;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 28px;
      letter-spacing: 2px;
    }

    header p {
      color: #aeb5c7;
      margin-top: 5px;
    }

    nav {
      margin-top: 15px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 8px;
      font-size: 14px;
    }

    nav a:hover {
      color: #ff4655;
    }

    .hero {
      min-height: 75vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
      background:
        radial-gradient(circle at center, #24283a 0%, #090b12 65%);
    }

    .hero h2 {
      font-size: 48px;
      max-width: 800px;
      margin-bottom: 20px;
    }

    .hero h2 span {
      color: #ff4655;
    }

    .hero p {
      max-width: 600px;
      color: #b9bfd0;
      font-size: 18px;
      margin-bottom: 30px;
    }

    .button {
      display: inline-block;
      padding: 14px 28px;
      background: #ff4655;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: 0.2s;
    }

    .button:hover {
      transform: scale(1.05);
    }

    section {
      padding: 70px 20px;
      max-width: 1000px;
      margin: auto;
    }

    section h2 {
      text-align: center;
      font-size: 32px;
      margin-bottom: 35px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: #151927;
      border: 1px solid #292e40;
      border-radius: 12px;
      padding: 25px;
      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: #ff4655;
    }

    .card h3 {
      margin-bottom: 10px;
      color: #ff4655;
    }

    .card p {
      color: #aeb5c7;
    }

    .mystery {
      text-align: center;
      background: #111522;
      border-radius: 15px;
      padding: 40px 20px;
    }

    .mystery p {
      color: #b9bfd0;
      margin-bottom: 20px;
    }

      padding: 30px 20px;
